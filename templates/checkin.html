
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>ระบบเช็กชื่อนักเรียน</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 30px auto;
            padding: 16px;
            background: #f4f6f8;
        }

        main {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #reader {
            width: 100%;
            margin-top: 12px;
        }

        #message {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
<main>
    <h2>เช็กชื่อนักเรียน</h2>
    <p>กดปุ่มเพื่อเปิดกล้องและสแกน QR Code</p>

    <div id="reader"></div>

    <button id="startButton" type="button">
        เปิดกล้องเพื่อสแกน
    </button>

    <p id="message" role="status"></p>
</main>

<!-- ไลบรารีสำหรับอ่าน QR Code -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
</script>

<script>
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    const scanner = new Html5Qrcode("reader");

    let scanning = false;
    let submitting = false;

    // ส่งรหัสนักเรียนไปตรวจสอบและบันทึก
    async function submitAttendance(studentId) {

        if (!studentId || submitting) return;

        submitting = true;
        startButton.disabled = true;

        message.textContent = "กำลังบันทึกข้อมูล...";

        try {
            const response = await fetch("/api/checkin", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    student_id: studentId
                })
            });

            const result = await response.json();

            message.textContent = result.message;

        } catch (error) {

            message.textContent =
                "ส่งข้อมูลไม่ได้ กรุณาตรวจสอบเครือข่าย";

        } finally {

            submitting = false;
            startButton.disabled = false;
            startButton.textContent = "สแกนอีกครั้ง";
        }
    }

    // เริ่มเปิดกล้อง
    async function startScanner() {

        if (scanning || submitting) return;

        try {

            message.textContent = "กำลังเปิดกล้อง...";

            await scanner.start(
                { facingMode: "environment" },

                {
                    fps: 10,
                    qrbox: {
                        width: 250,
                        height: 250
                    }
                },

                async (decodedText) => {

                    if (submitting) return;

                    // หยุดกล้องหลังอ่าน QR สำเร็จ
                    scanning = false;

                    try {
                        await scanner.stop();
                    } catch (error) {
                        console.log(error);
                    }

                    // ส่งรหัสนักเรียนไปยัง Flask
                    await submitAttendance(decodedText.trim());
                },

                () => {
                    // ยังอ่าน QR Code ไม่สำเร็จในเฟรมนี้
                }
            );

            scanning = true;

            startButton.textContent = "กำลังสแกน...";
            message.textContent = "กรุณานำ QR Code มาไว้หน้ากล้อง";

        } catch (error) {

            scanning = false;

            message.textContent =
                "เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง " +
                "และตรวจสอบว่าเว็บไซต์ใช้ HTTPS";

            startButton.textContent = "ลองเปิดกล้องอีกครั้ง";
        }
    }

    startButton.addEventListener("click", startScanner);

    // ปิดกล้องเมื่อออกจากหน้าเว็บ
    window.addEventListener("pagehide", async () => {

        if (scanning) {
            try {
                await scanner.stop();
            } catch (error) {
                console.log(error);
            }
        }
    });
</script>

</body>
</html>
