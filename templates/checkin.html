<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>ระบบเช็กชื่อนักเรียน</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 480px;
            margin: 30px auto;
            padding: 16px;
            background: #f4f6f8;
        }

        main {
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
        }

        video {
            width: 100%;
            margin-top: 12px;
            border-radius: 8px;
        }

        #message {
            margin-top: 16px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
<main>
    <h2>เช็กชื่อนักเรียน</h2>
    <p>สแกน QR Code ที่มีรหัสนักเรียน</p>

    <video id="video" autoplay playsinline hidden></video>

    <button id="startButton" type="button">
        เปิดกล้องเพื่อสแกน
    </button>

    <label for="studentId">รหัสนักเรียน</label>
    <input id="studentId"
           type="text"
           placeholder="เช่น 65001"
           autocomplete="off">

    <button id="submitButton" type="button">
        ส่งข้อมูลเช็กชื่อ
    </button>

    <p id="message" role="status"></p>
</main>

<script>
    const video = document.getElementById("video");
    const studentInput = document.getElementById("studentId");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const submitButton = document.getElementById("submitButton");

    let stream = null;
    let scanning = false;
    let submitting = false;
    let detector = null;
    let lastScanned = "";

    async function submitAttendance(studentId) {
        studentId = String(studentId).trim();

        if (!studentId || submitting) return;

        submitting = true;
        submitButton.disabled = true;
        message.textContent = "กำลังบันทึกข้อมูล...";

        try {
            const response = await fetch("/api/checkin", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    student_id: studentId
                })
            });

            const result = await response.json();

            message.textContent = result.message;
            lastScanned = studentId;

            if (result.success) {
                studentInput.value = "";
            }
        } catch (error) {
            message.textContent =
                "ส่งข้อมูลไม่ได้ กรุณาตรวจสอบเครือข่าย";
        } finally {
            submitting = false;
            submitButton.disabled = false;
        }
    }

    submitButton.addEventListener("click", () => {
        submitAttendance(studentInput.value);
    });

    async function scanLoop() {
        if (!scanning || !detector) return;

        try {
            if (video.readyState >= 2) {
                const codes = await detector.detect(video);

                if (codes.length > 0) {
                    const value = codes[0].rawValue.trim();

                    if (value && value !== lastScanned) {
                        studentInput.value = value;
                        await submitAttendance(value);
                    }
                }
            }
        } catch (error) {
            // กล้องอาจอ่านภาพไม่สำเร็จในบางเฟรม
        }

        if (scanning) {
            requestAnimationFrame(scanLoop);
        }
    }

    async function startScanner() {
        try {
            if (!("BarcodeDetector" in window)) {
                message.textContent =
                    "เบราว์เซอร์นี้ไม่รองรับตัวอ่าน QR Code " +
                    "กรุณาใช้ Chrome ที่รองรับ หรือพิมพ์รหัสทดสอบ";
                return;
            }

            detector = new BarcodeDetector({
                formats: ["qr_code"]
            });

            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment" },
                audio: false
            });

            video.srcObject = stream;
            video.hidden = false;
            await video.play();

            scanning = true;
            startButton.textContent = "กำลังสแกน...";
            scanLoop();

        } catch (error) {
            message.textContent =
                "เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้อง " +
                "และตรวจสอบว่าเว็บไซต์ใช้ HTTPS";
        }
    }

    startButton.addEventListener("click", startScanner);

    window.addEventListener("pagehide", () => {
        scanning = false;

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }
    });
</script>
</body>
</html>
